name: Agent dependency checks
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/agent-dependencies.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
